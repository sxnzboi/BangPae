<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>หมวดหมู่กิจกรรม – Watsup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app" style="padding-bottom:80px;">

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="top-bar-logo">
      <i class="fa-solid fa-fire-flame-curved" style="font-size:1.3rem;color:var(--lime);"></i>
      <span style="font-size:1.2rem;font-weight:900;margin-left:8px;">กิจกรรม</span>
    </div>
    <div class="top-bar-actions">
      <a href="chat.html" class="icon-btn">
        <i class="fa-solid fa-paper-plane"></i>
        <div class="badge">6</div>
      </a>
    </div>
  </header>

  <div class="radar-header">
    <h2>ค้นหากิจกรรม</h2>
    <p>เลือกกิจกรรมที่คุณสนใจเพื่อจับกลุ่มเพื่อน</p>
  </div>

  <div class="search-bar">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="ค้นหากิจกรรม เช่น เล่นเกม, แบดมินตัน..." oninput="filterActivities(this.value)" />
  </div>

  <!-- Trending Events -->
  <div class="section-title">
    <h3>Trending Events</h3>
    <a href="#" style="color:var(--lime);font-size:0.8rem;font-weight:700;" onclick="showToast('แสดงกิจกรรมทั้งหมด')">ทั้งหมด</a>
  </div>

  <div class="events-row" id="events-row"></div>

  <!-- Category Grid -->
  <div class="section-title" style="margin-top:10px;">
    <h3>หมวดหมู่ยอดนิยม</h3>
  </div>

  <div class="cat-grid" id="cat-grid"></div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="feed.html" class="nav-item">
      <i class="fa-solid fa-house"></i>
      <span>หน้าหลัก</span>
    </a>
    <a href="radar.html" class="nav-item">
      <i class="fa-solid fa-radar"></i>
      <span>ใกล้เคียง</span>
      <div class="nav-dot"></div>
    </a>
    <a href="activities.html" class="nav-item active">
      <i class="fa-solid fa-fire-flame-curved"></i>
      <span>กิจกรรม</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i class="fa-solid fa-circle-user"></i>
      <span>โปรไฟล์</span>
    </a>
  </nav>

</div>

<script src="js/data.js"></script>
<script>
let selectedCats = [];

function renderActivities() {
  const evRow = document.getElementById('events-row');
  evRow.innerHTML = TRENDING_EVENTS.map(e => `
    <div class="event-card" onclick="showToast('เข้าร่วมอีเวนต์: ${e.name}')">
      <div class="event-img" style="background:${e.bg};">
        <i class="fa-solid ${e.icon}" style="font-size:2.5rem;color:${e.iconColor};"></i>
      </div>
      <div class="event-info">
        <div class="event-name">${e.name}</div>
        <div class="event-meta"><i class="fa-solid fa-clock"></i> ${e.when}</div>
        <div class="event-attendees">
          ${[...Array(Math.min(e.count, 4))].map(() =>
            `<div class="attendee-pip" style="background:var(--purple-mid);"><i class="fa-solid fa-user" style="font-size:.5rem;"></i></div>`
          ).join('')}
          <span class="attendee-count">+${e.count} คน</span>
        </div>
      </div>
    </div>
  `).join('');

  renderCatGrid(ACTIVITIES);
}

function renderCatGrid(cats) {
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = cats.map(c => `
    <div class="cat-card ${selectedCats.includes(c.id) ? 'selected' : ''}"
         style="--cat-color:${c.color}"
         onclick="toggleCat('${c.id}', this)">
      ${c.badge ? `<div class="cat-badge ${c.badge==='hot'?'badge-hot':'badge-new'}">
        <i class="fa-solid ${c.badge==='hot'?'fa-fire':'fa-sparkles'}" style="font-size:.6rem;"></i>
        ${c.badge.toUpperCase()}</div>` : ''}
      <div class="cat-icon-wrap" style="background:${c.bg}; color:${c.color}">
        <i class="fa-solid ${c.icon}"></i>
      </div>
      <div class="cat-name">${c.label}</div>
      <div class="cat-count">${c.count} กลุ่ม</div>
    </div>
  `).join('');
}

function toggleCat(id, el) {
  const idx = selectedCats.indexOf(id);
  if (idx >= 0) selectedCats.splice(idx, 1);
  else selectedCats.push(id);
  el.classList.toggle('selected');
  const c = ACTIVITIES.find(a => a.id === id);
  showToast(selectedCats.includes(id) ? `เลือกหมวดหมู่ ${c.label}` : `ยกเลิก ${c.label}`);
}

function filterActivities(q) {
  const filtered = ACTIVITIES.filter(a =>
    a.label.toLowerCase().includes(q.toLowerCase()) ||
    a.id.includes(q.toLowerCase())
  );
  renderCatGrid(filtered);
}

document.addEventListener('DOMContentLoaded', renderActivities);
</script>
</body>
</html>
