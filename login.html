<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>เข้าสู่ระบบ – Watsup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <div class="login-header">
    <div class="logo-icon" style="width:60px;height:60px;">
      <i class="fa-solid fa-comments" style="font-size:1.8rem;"></i>
    </div>
    <h1 style="margin-top:12px;">ยินดีต้อนรับ!</h1>
    <p>เข้าสู่ระบบเพื่อพบเพื่อนใหม่รอบตัวคุณ</p>
  </div>

  <div class="login-body">
    <div class="input-group">
      <label>อีเมล / ชื่อผู้ใช้</label>
      <div class="input-wrap">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" placeholder="name@domain.com" id="login-email" value="user@watsup.app" />
      </div>
    </div>

    <div class="input-group">
      <label>รหัสผ่าน</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="••••••••" id="login-pw" value="12345678" />
        <button type="button" class="icon-btn" style="position:absolute;right:8px;background:none;width:32px;height:32px;" onclick="togglePw()">
          <i class="fa-solid fa-eye" id="pw-eye" style="color:var(--white-40);"></i>
        </button>
      </div>
    </div>

    <div style="text-align:right;">
      <a href="#" style="font-size:0.8rem;color:var(--purple-light);font-weight:600;" onclick="showToast('รีเซ็ตรหัสผ่านส่งไปยังอีเมลแล้ว')">ลืมรหัสผ่าน?</a>
    </div>

    <a href="feed.html" class="btn-primary" style="margin-top:4px;">
      <i class="fa-solid fa-arrow-right-to-bracket"></i> เข้าสู่ระบบ
    </a>

    <div class="divider">หรือเข้าสู่ระบบด้วย</div>

    <div class="social-login">
      <a href="feed.html" class="social-btn">
        <i class="fa-brands fa-google" style="color:#EA4335"></i> Google
      </a>
      <a href="feed.html" class="social-btn">
        <i class="fa-brands fa-apple" style="color:#fff"></i> Apple
      </a>
    </div>

    <div style="text-align:center;font-size:0.85rem;color:var(--white-70);margin-top:8px;">
      ยังไม่มีบัญชี? <a href="feed.html" style="color:var(--lime);font-weight:700;">สมัครสมาชิกฟรี</a>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script>
function togglePw() {
  const pw = document.getElementById('login-pw');
  const eye = document.getElementById('pw-eye');
  if (pw.type === 'password') {
    pw.type = 'text';
    eye.className = 'fa-solid fa-eye-slash';
  } else {
    pw.type = 'password';
    eye.className = 'fa-solid fa-eye';
  }
}
</script>
</body>
</html>
